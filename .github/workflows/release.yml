name: Validated release artifacts and provenance
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-artifacts
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          FULL_SELFTEST: '1'
      - run: npm run test:external-vectors
      - run: npm audit --audit-level=high
      - run: npm run check:repro
      - run: npm run check:repro
        env:
          BASE_PATH: /quantum-signer/
      - run: npm run test:release
      - run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quantum-signer-release
          path: release/
          include-hidden-files: true
          if-no-files-found: error
  attest:
    # No checkout or dependency execution in the job with signing capabilities.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quantum-signer-release
          path: release/
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/release-manifest.json
