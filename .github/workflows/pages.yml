name: Manual GitHub Pages demo
run-name: Manual Pages demo by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      acknowledge_public_demo:
        description: Acknowledge that GitHub Pages is a header-limited demo, not the supported local security boundary
        required: true
        type: boolean

# The dependency-running build job has read-only repository access. Only the
# small deploy job receives the Pages and OIDC publication capabilities.
permissions: {}

concurrency:
  group: pages-demo
  cancel-in-progress: false

jobs:
  build:
    name: Build header-limited demo
    if: ${{ inputs.acknowledge_public_demo && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Full release-candidate verification
        env:
          FULL_SELFTEST: '1'
        run: npm run check

      - name: Pinned Wycheproof and NIST ACVP vectors
        run: npm run test:external-vectors

      - name: Reproducible demo build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          PRIVATE_KEY_OPERATIONS: disabled
          BUILD_COMMIT: ${{ github.sha }}
        run: npm run check:repro

      - name: Confirm checks did not modify tracked sources
        run: git diff --exit-code

      - name: Upload demo artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Publish demo
    if: ${{ inputs.acknowledge_public_demo && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy header-limited public demo
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
