name: Extended cryptographic checks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  full-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      - name: Full cryptographic self-test
        env:
          FULL_SELFTEST: '1'
        run: npm run selftest

      - name: Pinned Wycheproof and NIST ACVP vectors
        run: npm run test:external-vectors

      - name: Dependency advisory audit
        run: npm audit
