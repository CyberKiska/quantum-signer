name: Extended cryptographic checks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  full-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Full cryptographic self-test
        env:
          FULL_SELFTEST: '1'
        run: npm run selftest

      - name: Pinned external ML-DSA verification vectors
        run: npm run test:external-vectors

      - name: Dependency advisory audit
        run: npm audit
