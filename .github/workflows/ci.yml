name: Continuous integration

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-validation:
    name: Quick validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Quick tests and production build
        run: npm run check

      - name: Reproducible build check
        run: npm run check:repro

      - name: High-severity dependency advisory gate
        run: npm audit --audit-level=high

      - name: Confirm checks did not modify tracked sources
        run: git diff --exit-code

  full-cryptographic-validation:
    name: Full cryptographic validation
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: quick-validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Full cryptographic self-test
        env:
          FULL_SELFTEST: '1'
        run: npm run selftest

      - name: Pinned Wycheproof and NIST ACVP vectors
        run: npm run test:external-vectors
